# Despliegue de la API de HealthMate en Render (Blueprint).
# En Render: New > Blueprint, elige este repositorio y la rama a desplegar.
services:
  - type: web
    name: healthmate-api
    runtime: python
    rootDir: backend
    plan: free
    # La base de Neon está en us-east-2 (Ohio): misma región para menor latencia.
    region: ohio
    buildCommand: pip install -r requirements.txt
    # Aplica migraciones pendientes antes de arrancar (en Neon ya está al día, no hace nada).
    startCommand: python -m alembic upgrade head && python -m uvicorn healthmate.main:app --host 0.0.0.0 --port $PORT
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      # Cadena de conexión de Neon: Render la pide al crear el Blueprint.
      - key: DATABASE_URL
        sync: false
      # Render genera un secreto aleatorio de 256 bits.
      - key: JWT_SECRET
        generateValue: true
      # Opcional: ID de cliente web de Google para "Continuar con Google".
      - key: GOOGLE_CLIENT_ID
        sync: false

  # Página de descarga de la app (sitio estático gratuito).
  - type: web
    name: healthmate-descarga
    runtime: static
    rootDir: web
    buildCommand: ""
    staticPublishPath: .
    autoDeployTrigger: commit
